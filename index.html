<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEP-26 · Bikaner ↔ Muktinath — Expedition Dossier</title>
  <meta name="description" content="A 14-night Himalayan workation: Bikaner to Muktinath in a Mahindra Thar Roxx. Trail Comms, Route Atlas, and Waypoints in one dossier.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#c8552a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
  <script>
    // Catchall fallback for paths we didn't mirror at build time. If
    // public/404.html bounced an unknown path here as /nep-26/?/foo,
    // decode it and replace the URL before React mounts so BrowserRouter
    // sees the original path and can route to it (or fall through to the
    // <Navigate to="/" /> catchall in App.jsx).
    // Known routes (/log, /map, etc.) get their own directory mirror at
    // build time and never hit this codepath.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) { return s.replace(/~and~/g, '&'); })
          .join('?');
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
