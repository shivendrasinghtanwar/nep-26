<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NEP-26 compass">
  <!-- alpine-night dial -->
  <circle cx="32" cy="32" r="30" fill="#0a1424" stroke="#c8552a" stroke-width="2"/>

  <!-- inner ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#d4a574" stroke-width="0.6" opacity="0.42"/>

  <!-- cardinal tick marks -->
  <g stroke="#d4a574" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <line x1="32" y1="5"  x2="32" y2="11"/>
    <line x1="32" y1="53" x2="32" y2="59"/>
    <line x1="5"  y1="32" x2="11" y2="32"/>
    <line x1="53" y1="32" x2="59" y2="32"/>
  </g>

  <!-- minor ticks -->
  <g stroke="#d4a574" stroke-width="0.6" opacity="0.4">
    <line x1="32" y1="9"  x2="32" y2="11" transform="rotate(45 32 32)"/>
    <line x1="32" y1="9"  x2="32" y2="11" transform="rotate(135 32 32)"/>
    <line x1="32" y1="9"  x2="32" y2="11" transform="rotate(225 32 32)"/>
    <line x1="32" y1="9"  x2="32" y2="11" transform="rotate(315 32 32)"/>
  </g>

  <!-- N marker -->
  <text x="32" y="16" text-anchor="middle" fill="#c8552a"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont"
        font-size="7" font-weight="700" letter-spacing="0.05em">N</text>

  <!-- compass needle, north (Thar rust) -->
  <path d="M32 12 L36 32 L32 28 L28 32 Z"
        fill="#c8552a" stroke="#0a1424" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- compass needle, south (cream) -->
  <path d="M32 52 L28 32 L32 36 L36 32 Z"
        fill="#ece5d3" stroke="#0a1424" stroke-width="0.6" stroke-linejoin="round" opacity="0.88"/>

  <!-- centre pin -->
  <circle cx="32" cy="32" r="2.6" fill="#d4a574" stroke="#0a1424" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="0.9" fill="#0a1424"/>
</svg>
