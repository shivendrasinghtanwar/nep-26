<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NEP-26 compass">
  <!-- alpine-night dial -->
  <circle cx="32" cy="32" r="30" fill="#0a1424"/>

  <!-- Thar-rust compass ring (matches Route Atlas trail-header mark) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#c8552a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- N-needle (rust diamond) -->
  <path d="M32,10 L36,32 L32,28 L28,32 Z" fill="#c8552a"/>

  <!-- E / S / W chevrons (faint dust) -->
  <path d="M54,32 L32,36 L36,32 L32,28" fill="none" stroke="#d4a574" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M32,54 L28,32 L32,36 L36,32" fill="none" stroke="#d4a574" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M10,32 L32,28 L28,32 L32,36" fill="none" stroke="#d4a574" stroke-opacity="0.55" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- centre pin -->
  <circle cx="32" cy="32" r="2.6" fill="#d4a574" stroke="#0a1424" stroke-width="0.7"/>
</svg>
