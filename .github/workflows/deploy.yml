name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, release]
    paths:
      - 'website/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON
        run: |
          python3 -c "import json; [json.load(open(f)) for f in ['data/rules.json','data/itinerary.json','data/checklist.json']]; print('JSON OK')"

      - name: Regenerate website/js/data.js from data/*.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          rules     = json.load(open(root/'data/rules.json'))
          itinerary = json.load(open(root/'data/itinerary.json'))
          checklist = json.load(open(root/'data/checklist.json'))
          trip = {
            "name": "Nepal Workation 2026",
            "depart": "2026-05-09",
            "return": "2026-05-23",
            "nights": 14,
            "travellers": 2,
            "vehicle": "Mahindra Thar Roxx (Thar Digital Services)",
            "capDays": 30,
            "permitDaysUsed": 18,
            "totalKm": 4410,
          }
          out = (
            "/* auto-generated from /data/*.json — do not hand-edit */\n"
            "window.TRIP = "      + json.dumps(trip, indent=2) + ";\n"
            "window.ITINERARY = " + json.dumps(itinerary['days'], indent=2) + ";\n"
            "window.RULES = "     + json.dumps(rules, indent=2) + ";\n"
            "window.CHECKLIST = " + json.dumps(checklist, indent=2) + ";\n"
          )
          (root/'website/js/data.js').write_text(out)
          print('data.js regenerated')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
