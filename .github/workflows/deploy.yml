name: Deploy NEP-26 to GitHub Pages

on:
  push:
    branches: [main, release]
    paths:
      - 'src/**'
      - 'data/**'
      - 'docs/**'
      - 'plans/**'
      - 'claude-code/**'
      - 'README.md'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate JSON
        run: |
          node -e "['data/rules.json','data/itinerary.json','data/checklist.json','data/route.json','data/hotels.json'].forEach(f => JSON.parse(require('fs').readFileSync(f,'utf8'))); console.log('JSON OK')"

      - name: Build (Vite)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
